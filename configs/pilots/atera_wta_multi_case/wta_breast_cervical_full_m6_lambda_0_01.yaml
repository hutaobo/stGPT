case_name: atera_wta_breast_cervical_full_m6_lambda_0_01
data:
  mode: corpus
  output_dir: ${STGPT_OUTPUT_ROOT}/pilot_runs/atera_wta_multi_case/wta_breast_cervical_full_m6_lambda_0_01/case
  dataset_roots:
    - ${STGPT_XENIUM_SLIDES}/WTA_Preview_FFPE_Breast_Cancer_outs
    - ${STGPT_XENIUM_SLIDES}/WTA_Preview_FFPE_Cervical_Cancer_outs
  batch_id: Atera_WTA
  stain: H&E
  min_cells_per_region: 1
  include_structure_context: false
model:
  d_model: 64
  n_heads: 4
  n_layers: 2
  dim_feedforward: 128
  max_genes: 256
  n_expression_bins: 32
  image_size: 64
  max_cells_per_region: 16
  n_prototypes: 32
  prototype_temperature: 0.1
  use_expression_values: true
  use_image_context: true
  use_spatial_context: true
  use_structure_context: false
  use_cell_context: true
training:
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 10000
  warmup_steps: 500
  lr_schedule: cosine
  save_every_n_steps: 500
  alignment_telemetry_every_n_steps: 250
  mask_probability: 0.15
  neighborhood_k: 8
  image_gene_loss_weight: 0.01
  neighborhood_loss_weight: 0.25
  structure_loss_weight: 0.0
  prototype_loss_weight: 0.1
  image_gene_loss_warmup_steps: 1000
  prototype_loss_warmup_steps: 1000
  prototype_queue_size: 16384
  prototype_queue_start_steps: 64
  prototype_sinkhorn_iterations: 3
  output_dir: ${STGPT_OUTPUT_ROOT}/pilot_runs/atera_wta_multi_case/wta_breast_cervical_full_m6_lambda_0_01/train
  device: cuda
  num_workers: 4
  seed: 7
split:
  strategy: spatial_block
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 11
