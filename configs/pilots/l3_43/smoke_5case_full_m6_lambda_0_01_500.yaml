case_name: l3_20260507_43case_smoke_5case_full_m6_lambda_0_01_500
data:
  mode: corpus
  output_dir: ${STGPT_OUTPUT_ROOT}/pilot_runs/l3_20260507_43case/smoke_5case_full_m6_lambda_0_01_500/case
  dataset_roots:
    - ${STGPT_XENIUM_SLIDES}/Xenium_Prime_Human_Lung_Cancer_FFPE_outs
    - ${STGPT_XENIUM_SLIDES}/Xenium_Prime_Human_Ovary_FF_outs
    - ${STGPT_XENIUM_SLIDES}/Xenium_Prime_Human_Skin_FFPE_outs
    - ${STGPT_XENIUM_SLIDES}/Xenium_Prime_Human_Prostate_FFPE_outs
    - ${STGPT_XENIUM_SLIDES}/Human_Breast_Biomarkers_S1_Bot_outs
  batch_id: l3_20260507_43case_smoke
  stain: H&E
  min_cells_per_region: 1
  include_structure_context: false
model:
  d_model: 64
  n_heads: 4
  n_layers: 2
  dim_feedforward: 128
  max_genes: 256
  n_expression_bins: 32
  image_size: 64
  max_cells_per_region: 16
  n_prototypes: 64
  prototype_temperature: 0.1
  use_expression_values: true
  use_image_context: true
  use_spatial_context: true
  use_structure_context: false
  use_cell_context: true
training:
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 500
  warmup_steps: 50
  lr_schedule: cosine
  save_every_n_steps: 250
  alignment_telemetry_every_n_steps: 125
  mask_probability: 0.15
  neighborhood_k: 8
  image_gene_loss_weight: 0.01
  neighborhood_loss_weight: 0.25
  structure_loss_weight: 0.0
  prototype_loss_weight: 0.1
  image_gene_loss_warmup_steps: 100
  prototype_loss_warmup_steps: 100
  prototype_queue_size: 16384
  prototype_queue_start_steps: 64
  prototype_sinkhorn_iterations: 3
  output_dir: ${STGPT_OUTPUT_ROOT}/pilot_runs/l3_20260507_43case/smoke_5case_full_m6_lambda_0_01_500/train
  device: cuda
  num_workers: 8
  seed: 7
split:
  strategy: slide_holdout
  group_key: corpus_slide_id
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 11
