    condition: Deep Gene+Spatial contour-unit 10k
    config_path: configs/pilots/atera_wta_v1_long_run/breast_gene_spatial_10k_contour_unit.yaml
    run_dir: outputs/pilot_runs/atera_wta_v1_long_run/breast_gene_spatial_10k_contour_unit
